<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrderOps — Kitchen</title>
<style>
  :root {
    --bg: #faf6f0; --card: #fffdfa; --ink: #241d17; --muted: #8a7d70;
    --line: #e8ddd0; --accent: #c8542b; --accent-soft: #f6e4d9;
    --ok: #2f7d5b; --bad: #b23b3b; --wait: #b9862f;
    --shadow: 0 1px 2px rgba(60,40,20,.04), 0 8px 24px rgba(60,40,20,.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 22px 32px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: rgba(250,246,240,.9);
    backdrop-filter: blur(8px); z-index: 5;
  }
  .brand { font-weight: 650; letter-spacing: -.01em; font-size: 20px; }
  .brand small { color: var(--muted); font-weight: 400; margin-left: 10px;
    font-size: 13px; letter-spacing: 0; }
  .who { font-size: 13px; color: var(--muted); }
  .who b { color: var(--ink); font-weight: 600; }
  .layout { display: grid; grid-template-columns: 1fr 340px; gap: 32px;
    max-width: 1160px; margin: 0 auto; padding: 32px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); font-weight: 600; margin: 0 0 16px; }

  .menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (max-width: 560px) { .menu { grid-template-columns: 1fr; } }
  .dish {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; display: flex; gap: 14px; box-shadow: var(--shadow);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .dish:hover { transform: translateY(-2px);
    box-shadow: 0 2px 4px rgba(60,40,20,.05), 0 14px 30px rgba(60,40,20,.09); }
  .plate { width: 64px; height: 64px; border-radius: 50%; flex: none;
    box-shadow: inset 0 0 0 4px rgba(255,255,255,.5), var(--shadow); }
  .dish .body { flex: 1; min-width: 0; }
  .dish .name { font-weight: 600; }
  .dish .desc { color: var(--muted); font-size: 13px; margin: 3px 0 10px; }
  .dish .foot { display: flex; align-items: center; justify-content: space-between; }
  .price { font-variant-numeric: tabular-nums; font-weight: 600; }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); border-radius: 9px; padding: 7px 13px; cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent);
    width: 100%; padding: 12px; font-weight: 600; border-radius: 11px; }
  button.primary:hover { filter: brightness(1.05); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .panel { background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px; box-shadow: var(--shadow);
    position: sticky; top: 96px; }
  .cart-line { display: flex; justify-content: space-between; align-items: center;
    padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .cart-line:last-of-type { border-bottom: 0; }
  .qty { display: inline-flex; align-items: center; gap: 8px; }
  .qty button { padding: 1px 9px; border-radius: 7px; line-height: 1.4; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0 16px; }
  .total { display: flex; justify-content: space-between; font-weight: 700;
    margin: 14px 0 18px; font-size: 17px; }

  .field { margin-bottom: 10px; }
  .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 9px; font: inherit; background: #fff; }
  .field input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* live saga */
  .saga { margin-top: 14px; }
  .step { display: flex; align-items: center; gap: 11px; padding: 8px 0; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--line);
    flex: none; transition: background .2s; }
  .step.done .dot { background: var(--ok); }
  .step.fail .dot { background: var(--bad); }
  .step.active .dot { background: var(--wait);
    box-shadow: 0 0 0 4px rgba(185,134,47,.18); animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(185,134,47,0); } }
  .step .label { flex: 1; }
  .step.pending .label { color: var(--muted); }
  .step .at { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .verdict { margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    font-weight: 600; font-size: 14px; }
  .verdict.ok { background: #e9f5ee; color: var(--ok); }
  .verdict.bad { background: #fbeaea; color: var(--bad); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px;
    font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
</style>
</head>
<body>
<header>
  <div class="brand">OrderOps <small>kitchen · saga-orchestrated checkout</small></div>
  <div class="who" id="who">not signed in · <a href="#" id="showLogin">sign in</a></div>
</header>

<div class="layout">
  <section>
    <h2>Menu</h2>
    <div class="menu" id="menu"></div>
  </section>

  <aside>
    <div class="panel" id="side">
      <!-- login -->
      <div id="loginBox">
        <h2>Sign in</h2>
        <div class="field"><input id="email" type="email" placeholder="email"></div>
        <div class="field"><input id="pass" type="password" placeholder="password"></div>
        <button class="primary" id="loginBtn">Sign in</button>
        <div class="hint">Demo: <b>rahul@orderops.dev</b> / <b>demo1234</b>.
          New here? Signing in with an unknown email registers it.</div>
      </div>

      <!-- cart -->
      <div id="cartBox" style="display:none">
        <h2>Your order</h2>
        <div id="cartLines"></div>
        <div class="total"><span>Total</span><span id="cartTotal">₹0.00</span></div>
        <button class="primary" id="placeBtn" disabled>Place order</button>
        <div class="saga" id="saga" style="display:none"></div>
        <div id="verdict"></div>
      </div>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
const money = c => "₹" + (c/100).toFixed(2);
const $ = id => document.getElementById(id);
let TOKEN = null, USER = null, CART = {}, PRODUCTS = {};

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

async function api(path, opts = {}) {
  opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (TOKEN) opts.headers["Authorization"] = "Bearer " + TOKEN;
  const r = await fetch(path, opts);
  const body = r.headers.get("content-type")?.includes("json") ? await r.json() : {};
  if (!r.ok) throw Object.assign(new Error(body.error || r.statusText), { status: r.status, body });
  return body;
}

// --- menu ---
async function loadMenu() {
  const { products } = await api("/api/catalog/products");
  const menu = $("menu"); menu.innerHTML = "";
  for (const p of products) {
    PRODUCTS[p.id] = p;
    const el = document.createElement("div");
    el.className = "dish";
    const hue = p.image_hue ?? 200;
    el.innerHTML = `
      <div class="plate" style="background:
        radial-gradient(circle at 32% 30%, hsl(${hue} 70% 82%), hsl(${hue} 55% 58%))"></div>
      <div class="body">
        <div class="name">${p.name}</div>
        <div class="desc">${p.description || ""}</div>
        <div class="foot"><span class="price">${money(p.price_cents)}</span>
          <button data-add="${p.id}">Add</button></div>
      </div>`;
    menu.appendChild(el);
  }
  menu.onclick = e => { const id = e.target.dataset.add; if (id) addToCart(id); };
}

// --- cart ---
function addToCart(id) { CART[id] = (CART[id] || 0) + 1; renderCart(); }
function setQty(id, q) { if (q <= 0) delete CART[id]; else CART[id] = q; renderCart(); }

function renderCart() {
  const lines = $("cartLines"); lines.innerHTML = "";
  let total = 0, count = 0;
  for (const [id, q] of Object.entries(CART)) {
    const p = PRODUCTS[id]; total += p.price_cents * q; count += q;
    const el = document.createElement("div");
    el.className = "cart-line";
    el.innerHTML = `<span>${p.name}</span>
      <span class="qty">
        <button data-dec="${id}">–</button><b>${q}</b><button data-inc="${id}">+</button>
        <span style="width:74px;text-align:right">${money(p.price_cents * q)}</span>
      </span>`;
    lines.appendChild(el);
  }
  if (count === 0) lines.innerHTML = `<div class="empty">Your order is empty — add a dish.</div>`;
  $("cartTotal").textContent = money(total);
  $("placeBtn").disabled = count === 0;
  lines.onclick = e => {
    const inc = e.target.dataset.inc, dec = e.target.dataset.dec;
    if (inc) setQty(inc, CART[inc] + 1);
    if (dec) setQty(dec, CART[dec] - 1);
  };
}

// --- auth ---
async function signIn() {
  const id = $("email").value.trim(), password = $("pass").value;
  if (!id || !password) return toast("email and password required");
  try {
    let res;
    try { res = await api("/api/auth/login", { method: "POST",
      body: JSON.stringify({ id, password }) }); }
    catch (e) {
      if (e.status === 401) { // unknown / wrong — try registering the email
        res = await api("/api/auth/register", { method: "POST",
          body: JSON.stringify({ id, password }) });
        toast("account created");
      } else throw e;
    }
    TOKEN = res.token; USER = res;
    $("who").innerHTML = `signed in as <b>${res.name}</b> · <a href="#" id="out">sign out</a>`;
    $("out").onclick = signOut;
    $("loginBox").style.display = "none";
    $("cartBox").style.display = "block";
    renderCart();
  } catch (e) { toast(e.message || "sign in failed"); }
}
function signOut() {
  TOKEN = null; USER = null; CART = {};
  $("who").innerHTML = `not signed in · <a href="#" id="showLogin">sign in</a>`;
  $("showLogin").onclick = () => {};
  $("cartBox").style.display = "none";
  $("loginBox").style.display = "block";
}

// --- place order + live saga ---
const STEPS = [
  { key: "order.created",      label: "Order received" },
  { key: "stock.reserved",     label: "Ingredients reserved" },
  { key: "payment.authorized", label: "Payment authorized" },
  { key: "order.confirmed",    label: "Confirmed — cooking!" },
];
const FAILS = {
  "stock.rejected":   { after: "order.created",  msg: "Out of stock — order cancelled." },
  "payment.declined": { after: "stock.reserved", msg: "Card declined — reservation released." },
  "order.cancelled":  { msg: "Order cancelled." },
};

function renderSaga(state) {
  const box = $("saga"); box.style.display = "block"; box.innerHTML = "";
  STEPS.forEach((s, i) => {
    const done = state.seen.has(s.key);
    const active = !done && i === state.firstPending;
    const el = document.createElement("div");
    el.className = "step " + (done ? "done" : active ? "active" : "pending");
    el.innerHTML = `<span class="dot"></span><span class="label">${s.label}</span>
      <span class="at">${state.at[s.key] || ""}</span>`;
    box.appendChild(el);
  });
}

async function placeOrder() {
  $("placeBtn").disabled = true;
  $("verdict").innerHTML = "";
  const items = Object.entries(CART).map(([product_id, qty]) => ({ product_id, qty }));
  let order;
  try {
    order = await api("/api/orders", { method: "POST",
      body: JSON.stringify({ customer: USER.name, items }) });
  } catch (e) { toast(e.message); $("placeBtn").disabled = false; return; }

  const state = { seen: new Set(), at: {}, firstPending: 0 };
  const mark = (type, when) => {
    state.seen.add(type);
    state.at[type] = when ? new Date(when).toLocaleTimeString() : "";
    state.firstPending = STEPS.findIndex(s => !state.seen.has(s.key));
    if (state.firstPending < 0) state.firstPending = STEPS.length;
    renderSaga(state);
  };
  mark("order.created", order.created_at);

  const es = new EventSource("/api/events/" + order.id);
  es.onmessage = ev => {
    const e = JSON.parse(ev.data);
    if (STEPS.some(s => s.key === e.type)) mark(e.type, e.at);
    if (e.type === "order.confirmed") { finish(true); }
    if (FAILS[e.type]) {
      const reason = (JSON.parse(e.data || "{}").reason) || FAILS[e.type].msg;
      finish(false, reason);
    }
  };
  function finish(ok, reason) {
    es.close();
    const v = $("verdict");
    v.innerHTML = `<div class="verdict ${ok ? "ok" : "bad"}">${
      ok ? "✓ Order confirmed — your kitchen ticket is live." : "✕ " + reason}</div>`;
    if (ok) { CART = {}; renderCart(); }
    $("placeBtn").disabled = false;
  }
  // fallback: if SSE misses the terminal frame, poll once after 6s
  setTimeout(async () => {
    if (es.readyState !== 2) {
      try { const { order: o } = await api("/api/orders/" + order.id);
        if (o.state === "confirmed") finish(true);
        else if (o.state === "cancelled") finish(false, o.reason || "cancelled");
      } catch {}
    }
  }, 6000);
}

// --- wire ---
$("loginBtn").onclick = signIn;
$("pass").addEventListener("keydown", e => { if (e.key === "Enter") signIn(); });
$("placeBtn").onclick = placeOrder;
$("showLogin").onclick = () => $("email").focus();
loadMenu();
renderCart();
</script>
</body>
</html>
